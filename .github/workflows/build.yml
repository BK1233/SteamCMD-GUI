name: Build SteamCMD GUI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    
    strategy:
      matrix:
        configuration: [Debug, Release]
        platform: [x86]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET Framework
      uses: microsoft/setup-msbuild@v1.3

    - name: Setup NuGet
      uses: nuget/setup-nuget@v1
      with:
        nuget-version: 'latest'

    - name: Restore NuGet packages
      run: nuget restore "Source/SteamCMD GUI.sln"

    - name: Build solution
      run: msbuild "Source/SteamCMD GUI.sln" /p:Configuration=${{ matrix.configuration }} /p:Platform=${{ matrix.platform }} /p:OutputPath=bin\${{ matrix.configuration }}\

    - name: Upload build artifacts
      if: matrix.configuration == 'Release'
      uses: actions/upload-artifact@v4
      with:
        name: SteamCMD-GUI-${{ matrix.configuration }}-${{ matrix.platform }}
        path: Source/SteamCMD GUI/bin/${{ matrix.configuration }}/

    - name: Test executable exists
      if: matrix.configuration == 'Release'
      run: |
        if (Test-Path "Source/SteamCMD GUI/bin/${{ matrix.configuration }}/SteamCMD GUI.exe") {
          Write-Host "✅ Build successful: SteamCMD GUI.exe found"
        } else {
          Write-Host "❌ Build failed: SteamCMD GUI.exe not found"
          exit 1
        }

  # Optional: Create release on tags
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: windows-latest
    
    steps:
    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        name: SteamCMD-GUI-Release-x86
        path: release/

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: release/*
        draft: true
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}